name: CodeAnt Scan

on:
  pull_request:

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Trigger CodeAnt Scan
        run: |
          curl -X POST https://api.codeant.ai/scan \
          -H "Authorization: Bearer ${{ secrets.CODEANT_API_KEY }}" \
          -d '{
            "repo": "${{ github.repository }}",
            "pr": "${{ github.event.pull_request.number }}"
          }'

      - name: Simulate Quality Gate (FAIL for demo)
        run: |
          echo "Failing build to simulate critical vulnerability"
          exit 1
